name: Auto Generate Arno Configs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WireGuard Tools
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Generator Script
        run: python generate.py

      - name: Commit and push real configs
        run: |
          git config --global user.name "ArnoAutomationBot"
          git config --global user.email "bot@arno.io"
          git checkout configs || git checkout -b configs
          git add configs/
          git commit -m "Auto update configs" || echo "No changes"
          git push origin configs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
